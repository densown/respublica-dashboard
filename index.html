<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Res.Publica · Politische Daten nachprüfbar</title>
    <meta
      name="description"
      content="Gesetze, namentliche Abstimmungen, Lobbyregister, EU-Recht und Wahlen aus amtlichen Quellen — gesammelt, verknüpft und täglich aktualisiert."
    />
    <link rel="canonical" href="https://app.respublica.media/" />

    <!-- Symbol der Seite. Dieselben Zuschnitte wie respublica.media, damit
         Magazin und Anwendung dasselbe Zeichen tragen. Die frühere Datei hieß
         Logo.png, war aber ein JPEG und mit 361 KB als Symbol unbrauchbar. -->
    <link rel="icon" type="image/jpeg" sizes="32x32" href="/icon-32x32.jpg" />
    <link rel="icon" type="image/jpeg" sizes="192x192" href="/icon-192x192.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180x180.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#C8102E" />

    <!-- Vorschau beim Teilen. Ohne diese Angaben zeigen Reddit, X und
         WhatsApp eine leere Karte — bei einem Projekt, das über Reddit
         Reichweite sucht, der teuerste einzelne Mangel. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Res.Publica" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Res.Publica · Politische Daten nachprüfbar" />
    <meta
      property="og:description"
      content="Gesetze, namentliche Abstimmungen, Lobbyregister, EU-Recht und Wahlen aus amtlichen Quellen — gesammelt, verknüpft und täglich aktualisiert."
    />
    <meta property="og:url" content="https://app.respublica.media/" />
    <meta property="og:image" content="https://app.respublica.media/share-og-v3.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Res.Publica · Politik, nachprüfbar" />
    <!-- summary_large_image statt summary: erst damit zeigen X und Reddit die
         grosse Vorschaukarte statt eines kleinen Quadrats neben dem Text. -->
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Ohne JavaScript bleibt #root leer. Abrufe ohne Browser (Suchmaschinen,
         KI-Assistenten, Linkvorschauen) sahen bisher eine leere Seite und
         schlossen daraus, es gebe hier nichts. Dieser Block nennt die Bereiche. -->
    <noscript>
      <main style="max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font-family: Georgia, serif; line-height: 1.6">
        <h1>Res.Publica · Politische Daten nachprüfbar</h1>
        <p>
          Diese Anwendung braucht JavaScript. Sie sammelt Daten aus amtlichen
          Quellen und wird täglich aktualisiert. Bereiche:
        </p>
        <ul>
          <li><a href="/bundestag">Namentliche Abstimmungen und Abgeordnete im Bundestag</a></li>
          <li><a href="/gesetze">Gesetzesänderungen und Urteile</a></li>
          <li><a href="/lobbyregister">Lobbyregister</a></li>
          <li><a href="/eu-recht">EU-Recht</a></li>
          <li><a href="/wahlen">Wahlen und Umfragen</a></li>
          <li><a href="/quellen">Quellen</a></li>
        </ul>
        <p>Magazin: <a href="https://respublica.media/">respublica.media</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
