# Routen von app.respublica.media: Weiterleitungen alter Adressen und
# echter Status 404 fuer unbekannte Pfade.
#
# Ersetzt im server-Block von app.respublica.media (Port 443) den bisherigen
# "location / { try_files $uri $uri/ /index.html; ... }". Alles andere im
# Block bleibt: root, location /api/, ^~ /data/, = /manifest.webmanifest,
# die Regex fuer Skripte und Bilder und vor allem location = /index.html.
# Anleitung: README.md hier.
#
# Bisher lieferte jeder Pfad index.html mit Status 200. Wer die Seite ohne
# JavaScript abruft (Suchmaschinen, KI-Assistenten), sah unter jeder Adresse
# dieselbe leere Seite und konnte echte von erfundenen Pfaden nicht trennen.
#
# Zwei Dinge aus dem bestehenden Block muessen hier mitgehen:
# - Jede Location bindet snippets/security-headers.conf ein. add_header wird
#   nicht von aussen geerbt, sobald eine Location eigene Header setzt.
# - Seiten kommen ueber eine interne Weiterleitung auf /index.html
#   (rewrite ... last). Dort setzt location = /index.html
#   "no-store". Ein direktes try_files /index.html wuerde die Datei in der
#   eigenen Location ausliefern, ohne diese Header, und Browser koennten nach
#   einem Deploy eine alte index.html mit nicht mehr vorhandenen Skripten
#   behalten.
#
# Neue Route in src/App.tsx: unten in die Liste der Seiten aufnehmen.
# Die CI prueft das (deploy/nginx/routen-pruefen.mjs), nach dem Merge muss
# die Datei aber von Hand neu eingespielt werden, siehe README.md.

# Weiterleitungen relativ ausgeben ("Location: /bundestag"). So stimmt das
# Schema auch dann, wenn ein Proxy davor TLS beendet.
absolute_redirect off;

# Alte Adressen, vor dem Umbau im Oktober 2026. Fragezeichen am Ende der
# rewrite-Ziele: alte Parameter fallen weg.
location = /abstimmungen {
    include snippets/security-headers.conf;
    return 301 /bundestag;
}
location ^~ /abstimmungen/ {
    include snippets/security-headers.conf;
    rewrite ^/abstimmungen/([0-9]+)/?$ /bundestag/$1? permanent;
    return 301 /bundestag;
}
location = /abgeordnete {
    include snippets/security-headers.conf;
    return 301 /bundestag?ansicht=abgeordnete;
}
location ^~ /abgeordnete/ {
    include snippets/security-headers.conf;
    rewrite ^/abgeordnete/([0-9]+)/?$ /bundestag/abgeordnete/$1? permanent;
    return 301 /bundestag?ansicht=abgeordnete;
}
location = /demokratie-index {
    include snippets/security-headers.conf;
    return 301 /demokratie;
}

# Startseite
location = / {
    rewrite ^ /index.html last;
}

# Seiten der App: index.html mit Status 200. Nummern von Abstimmungen und
# Abgeordneten nur als Ziffern, Gesetze und EU-Recht nehmen jede Kennung.
# Ob es die Nummer gibt, weiss nur die API; fehlt sie, zeigt die Seite
# "gibt es nicht" und setzt noindex.
# routen-pruefen: seiten
location ~ ^/(?:wahlen(?:/umfragen|/kandidaturen)?|quellen|bundestag(?:/[0-9]+|/abgeordnete/[0-9]+)?|(?:gesetze|gesetzgebung|eu-recht)(?:/[^/]+)?|koalition|koalitionsvertrag|demokratie|versammlungen|weltkarte|eu-parlament|lobbyregister|admin)/?$ {
    rewrite ^ /index.html last;
}

# Alles andere: vorhandene Datei aus dist (robots.txt, sitemap.xml und
# Dateien, die die Regex fuer Skripte und Bilder nicht erfasst), sonst
# Status 404. Als Inhalt der 404 kommt trotzdem die App, damit Menschen die
# Fehlerseite mit Links zu Start und Bundestag sehen. error_page ohne "="
# behaelt den Status 404 bei.
location / {
    try_files $uri =404;
    error_page 404 @fehlerseite;
    include snippets/security-headers.conf;
}

# Eigene Location statt location = /index.html: deren Cache-Control steht
# ohne "always" und fehlt deshalb bei Status 404.
location @fehlerseite {
    include snippets/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    rewrite ^ /index.html break;
}
