# Routen von app.respublica.media: Weiterleitungen alter Adressen und
# echter Status 404 fuer unbekannte Pfade.
#
# Einbinden im server-Block von app.respublica.media (Port 443) an Stelle des
# bisherigen "location / { try_files ... /index.html; }". root, location /api/
# und alles andere im Block bleiben, wie sie sind. Anleitung: README.md hier.
#
# Bisher lieferte jeder Pfad index.html mit Status 200. Wer die Seite ohne
# JavaScript abruft (Suchmaschinen, KI-Assistenten), sah unter jeder Adresse
# dieselbe leere Seite und konnte echte von erfundenen Pfaden nicht trennen.
#
# Neue Route in src/App.tsx: unten in die Liste der Seiten aufnehmen.
# Die CI prueft das (deploy/nginx/routen-pruefen.mjs), nach dem Merge muss
# die Datei aber von Hand neu eingespielt werden, siehe README.md.

# Weiterleitungen relativ ausgeben ("Location: /bundestag"). So stimmt das
# Schema auch dann, wenn ein Proxy davor TLS beendet.
absolute_redirect off;

# Alte Adressen, vor dem Umbau im Oktober 2026. Fragezeichen am Ende der
# rewrite-Ziele: alte Parameter fallen weg.
location = /abstimmungen { return 301 /bundestag; }
location ^~ /abstimmungen/ {
    rewrite ^/abstimmungen/([0-9]+)/?$ /bundestag/$1? permanent;
    return 301 /bundestag;
}
location = /abgeordnete { return 301 /bundestag?ansicht=abgeordnete; }
location ^~ /abgeordnete/ {
    rewrite ^/abgeordnete/([0-9]+)/?$ /bundestag/abgeordnete/$1? permanent;
    return 301 /bundestag?ansicht=abgeordnete;
}
location = /demokratie-index { return 301 /demokratie; }

# Startseite
location = / {
    try_files /index.html =404;
}

# Seiten der App: index.html mit Status 200. Nummern von Abstimmungen und
# Abgeordneten nur als Ziffern, Gesetze und EU-Recht nehmen jede Kennung.
# Ob es die Nummer gibt, weiss nur die API; fehlt sie, zeigt die Seite
# "gibt es nicht" und setzt noindex.
# routen-pruefen: seiten
location ~ ^/(?:wahlen(?:/umfragen|/kandidaturen)?|quellen|bundestag(?:/[0-9]+|/abgeordnete/[0-9]+)?|(?:gesetze|gesetzgebung|eu-recht)(?:/[^/]+)?|koalition|koalitionsvertrag|demokratie|versammlungen|weltkarte|eu-parlament|lobbyregister|admin)/?$ {
    try_files /index.html =404;
}

# Alles andere: vorhandene Datei aus dist (Skripte, Bilder, robots.txt,
# sitemap.xml, data/), sonst Status 404. Als Inhalt der 404 kommt trotzdem
# die App, damit Menschen die Fehlerseite mit Links zu Start und Bundestag
# sehen. error_page ohne "=" behaelt den Status 404 bei.
location / {
    try_files $uri =404;
    error_page 404 /index.html;
}
